name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require cite pack files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
      - name: Secret-pattern scrub
        run: |
          if grep -R -n -E "BEGIN (RSA |OPENSSH )?PRIVATE KEY|sk-ant-|sk-proj-|ghp_[A-Za-z0-9]{20,}" --exclude-dir=.git . ; then
            echo "secret-like pattern found" >&2
            exit 1
          fi
          echo "scrub pass"
      - name: HTML smoke
        run: |
          if ls *.html >/dev/null 2>&1; then
            for f in *.html; do
              grep -qiE "<!doctype|<html" "$f" || { echo "bad html: $f"; exit 1; }
            done
            echo "html_ok"
          else
            echo "no html (ok for template)"
          fi

