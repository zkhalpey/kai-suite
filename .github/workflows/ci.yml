name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require cite pack files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
      - name: Secret-pattern scrub
        run: |
          # Exclude workflow files so the pattern string itself is not a false positive.
          hits=$(grep -R -n -E "BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|sk-ant-|sk-proj-" \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.yml" --exclude="*.yaml" . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "secret-like pattern found" >&2
            exit 1
          fi
          echo "scrub pass"
      - name: HTML smoke
        run: |
          if ls *.html >/dev/null 2>&1; then
            for f in *.html; do
              grep -qiE "<!doctype|<html" "$f" || { echo "bad html: $f"; exit 1; }
            done
            echo "html_ok"
          else
            echo "no html (ok for template)"
          fi

